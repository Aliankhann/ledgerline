# L-07 AC8 (window boundaries) and AC9 (a gain is never flagged). Rule set assumed: CA-ITA-2026.1 (SL-WINDOW).
# Source: Income Tax Act s. 54, definition "superficial loss" (copy dated 2026-11-16):
# "the taxpayer's loss from the disposition of a particular property where (a) during the period that begins 30 days
# before and ends 30 days after the disposition, the taxpayer or a person affiliated with the taxpayer acquires a
# property ... identical to the particular property, and (b) at the end of that period, the taxpayer ... owns ... the
# substituted property". TaxTips.ca: "61-day time period (30 days prior + date of disposition + 30 days after)".
# adjustedcostbase.ca blog p=438: "wait at least 31 days before repurchasing".
# This is rule text, not a worked example. The story says the four dated cases are BA-chosen test shapes (D = 2025-06-02).
# Only "superficial loss recorded or not" is asserted, never an amount.
source.id=ITA-54
source.url=https://laws-lois.justice.gc.ca/eng/acts/i-3.3/section-54.html
source.heading=superficial loss
