# L-07 AC4 and AC11. Rule set assumed: CA-ITA-2026.1.
# Source: adjustedcostbase.ca, "Capital Gains and Losses for In-Kind Contributions to Registered Accounts",
# "Example #2 - In-Kind Contribution of Shares that Have Fallen in Value".
# Quote: "You own 100 shares of BCE with a total ACB $2,500 or $25/share. You make an in-kind contribution to your TFSA
# of 60 shares when the market value is $20/share." "you should see a capital loss of $300 ... This capital loss,
# however, is a superficial loss, and is permanently denied." "the total ACB remains $1,000".
# Same page: an in-kind contribution is "equivalent to: Selling the shares in your non-registered account.
# Transferring the cash proceeds into your registered account. Repurchasing the shares in your registered account."
# The purchase history (one buy of 100 at 2500 on 2025-01-02) is BA-chosen in the story; the source gives only the ACB.
source.id=ACB-INKIND
source.url=https://www.adjustedcostbase.ca/blog/?p=438
source.heading=Example #2 - In-Kind Contribution of Shares that Have Fallen in Value
security=SYN-D
t1.type=BUY
t1.date=2025-01-02
t1.shares.units=100000000
t1.price.cents=2500
t1.account=NR_A
t2.type=SELL
t2.date=2025-06-02
t2.shares.units=60000000
t2.price.cents=2000
t2.account=NR_A
t3.type=BUY
t3.date=2025-06-02
t3.shares.units=60000000
t3.price.cents=2000
t3.account=TFSA
expected.t2.lossBeforeRule.cents=30000
expected.t2.denied.cents=30000
expected.t2.allowed.cents=0
expected.afterT3.shares.units=40000000
expected.afterT3.acb.cents=100000
expected.outcome=PERMANENTLY_LOST
expected.trigger.account=TFSA
