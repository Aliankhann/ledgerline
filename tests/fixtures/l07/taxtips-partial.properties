# L-07 AC6a and AC6b. Rule set assumed: CA-ITA-2026.1 (SL-PARTIAL adopts the formula; owner has not accepted it).
# Source: TaxTips.ca, "Superficial losses and other disallowed losses", section "Partial Disposition of Shares".
# Quote: "SL (superficial loss) = (least of S, P and B)/S x L, where S = number of items disposed of at that time,
# P = number of items acquired in the 61-day period, B = number of items left at the end of the period, and
# L = loss on the disposition as otherwise determined."
# Case a: "S = 50 / P = 20 / B = 20 / L = $1,000 / SL = 20/50 x 1,000 = $400".
# Case b: "S = 50 / P = 150 / B = 120 / L = $1,000 / SL = 50/50 x $1,000 = $1,000" (assume 20 shares owned prior).
# The source gives S, P, B, L only. Prices and dates below are BA-chosen in the story to fit them; they are not source.
# TaxTips attributes the formula to CRA T.I. 2004-0073011E5 (not opened; second-hand).
