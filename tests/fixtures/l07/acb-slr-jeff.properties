# L-07 AC7 (loss allowed, nothing held at window end) and AC9 (a gain sale is never flagged; first three trades).
# Rule set assumed: CA-ITA-2026.1.
# Source: adjustedcostbase.ca, "Applying the Superficial Loss Rule with AdjustedCostBase.ca", reader comment "Jeff"
# (2017-12-03) and the site author's reply of the same date. Quote: "October 25th, 2014: Buy 100 shares for $50 per
# share - November 3rd, 2014: Sell 100 shares for $60 per share - November 4th, 2014: Buy 100 shares for $50 per
# share - November 8th, 2014: Sell 100 shares for $40 per share". Author: "Assuming that there are no other
# transactions for the same security within 30 days following November 8th, 2014, then the superficial loss rule would
# not apply ... the share balance is zero after November 8th, 2014."
# The source states no loss amount; the test asserts only denied = 0 and allowed = the full computed loss.
# AC9 expectations (no flag on the 2014-11-03 gain) come from the definition: ITA-54 "the taxpayer's loss from the
# disposition", see ita54-window.properties.
