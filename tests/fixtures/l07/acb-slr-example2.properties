# L-07 AC5. Rule set assumed: CA-ITA-2026.1.
# Source: adjustedcostbase.ca, "Applying the Superficial Loss Rule with AdjustedCostBase.ca", section "Example #2".
# Quote: "The buy transaction on 2014-Nov-04 and the sell transaction on 2015-Dec-02 now occur in your RRSP account
# instead of your non-registered account." "The capital loss is denied and reduced from $2,000 to $0 (as was the case
# in Example #1). But the reduction in the capital loss is not added to the ACB here, because the repurchase occurred
# in a registered account. The ACB is $0 following the 'Sell' transaction."
# Reply under the same page (2025-05-03): "the capital loss is permanently denied".
