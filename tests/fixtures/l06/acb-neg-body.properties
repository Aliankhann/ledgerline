# L-06 AC5. Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md: ROC-REDUCES-ACB, ROC-NEG-GAIN, ROC-NEG-RESET,
# ROC-NEG-DATE). Source: adjustedcostbase.ca, "Can My Adjusted Cost Base be Negative?" (ACB-NEG), article body.
# Restated in the story's units. The source gives months only (2014); the story restates them as the first of each
# month in 2025. The source gives no quantity: 100 shares at 1000 cents is the BA's proposal and changes no value.
# Quote: "The first transaction in April is a purchase of $1,000 of the security with a $10 commission, resulting in an
# initial ACB of $1,010. Next, in May, a $500 ROC distribution occurs, reducing the ACB to $510. Then in June, a $600
# ROC distribution occurs. In this case, the ACB is reduced to $0 since $600 exceeds the ACB of $510. Furthermore, a
# capital gain of $90 ($600 less $510) is immediately applicable and must be reported for the 2014 tax year. Finally in
# July, a further ROC distribution occurs. Since the ACB has already been reduced to zero, the entire distribution of
# $100 is taxable as a capital gain in 2014." Same page: "your ACB cannot go below zero, according to Canada Revenue
# Agency rules".
source.id=ACB-NEG
source.url=https://www.adjustedcostbase.ca/blog/?p=4
source.heading=Can My Adjusted Cost Base be Negative? (article body)
security=SYN-C

t1.type=BUY
t1.date=2025-04-01
t1.shares.units=100000000
t1.price.cents=1000
t1.commission.cents=1000
t1.expected.shares.units=100000000
t1.expected.acb.cents=101000

t2.type=RETURN_OF_CAPITAL
t2.date=2025-05-01
t2.amount.cents=50000
t2.expected.shares.units=100000000
t2.expected.acb.cents=51000
t2.expected.gain.cents=0

t3.type=RETURN_OF_CAPITAL
t3.date=2025-06-01
t3.amount.cents=60000
t3.expected.shares.units=100000000
t3.expected.acb.cents=0
t3.expected.gain.cents=9000

t4.type=RETURN_OF_CAPITAL
t4.date=2025-07-01
t4.amount.cents=10000
t4.expected.shares.units=100000000
t4.expected.acb.cents=0
t4.expected.gain.cents=10000
