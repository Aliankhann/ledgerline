# L-06 AC8 (rule, not numbers). Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md: POOL-IDENTICAL,
# POOL-REGISTERED-EXCL). The expected pool is ACB-HOWTO transaction 1 (acb-howto-chain.properties, t1).
# Source: adjustedcostbase.ca, "Should RRSP and TFSA Transactions be Included when Calculating ACB?" (ACB-REG), article
# text: "adjusted cost base should be calculated jointly when an identical security is owned in multiple
# non-registered accounts. Transactions in registered accounts should not be considered when calculating ACB. ...
# transactions within the registered account have no affect whatsoever on the ACB and capital gains for the security in
# the non-registered account." Also ACB-HOWTO: "If you own the same security in multiple accounts, ACB must be
# calculated jointly." and ACTIVEACB (https://activeacb.ca/book-cost-vs-acb.html): "all of your holdings of an
# identical security are one pooled position with one averaged ACB, per taxpayer, across every non-registered account".
# The split commissions and the TFSA buy are BA-chosen test shapes (story AC8); no tax value depends on them.
source.id=ACB-REG
source.url=https://www.adjustedcostbase.ca/blog/?p=154
source.heading=Should RRSP and TFSA Transactions be Included when Calculating ACB? (article text)
security=SYN-A

# Run 2: account A (non-registered) and account B (non-registered), same date as the run-1 buy.
a.date=2025-03-03
a.shares.units=60000000
a.price.cents=5000
a.commission.cents=600
b.date=2025-03-03
b.shares.units=40000000
b.price.cents=5000
b.commission.cents=400

# Run 3: run 1 plus a TFSA buy of 25 shares (price and commission QE-chosen; they must not matter).
tfsa.date=2025-03-10
tfsa.shares.units=25000000
tfsa.price.cents=5000
tfsa.commission.cents=999

expected.shares.units=100000000
expected.acb.cents=501000
