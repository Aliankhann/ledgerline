# L-06 AC2b (supplementary). Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md: POOL-IDENTICAL, COST-BUY-COMMISSION,
# ROUND-MODE for the per-share display only).
# Source: adjustedcostbase.ca, "Can My Adjusted Cost Base be Negative?" (ACB-NEG), comment thread, reader "Sharon1"
# (2015-10-27): 280 shares with ACB zero, buying 90 more at $55.61 with a $43.00 commission.
# Site author reply (2015-10-27): "$0.00 + (90 shares x $55.61/share) + $43.00 = $5,047.90".
# Reader (2015-10-28): "my price ACB per share would now be $5047.90/ 370 shares (280 +90) giving me $13.64";
# author (2015-10-28): "Yes, you got it."
# Caveats (story): a comment thread, not the article body. The source gives only the end state of the 280-share,
# zero-ACB pool, so the test builds it (a buy, then a ROC equal to its ACB; QE-chosen shape, no value asserted on it).
# 13.6427... to 13.64 is the same under half-up, half-even and truncation, so this cannot choose a rounding rule.
source.id=ACB-NEG
source.url=https://www.adjustedcostbase.ca/blog/?p=4
source.heading=Can My Adjusted Cost Base be Negative? (comments: Sharon1, 2015-10-27 and 2015-10-28)
security=SYN-D

# Setup, QE-chosen: reach "280 shares, ACB 0".
setup.buy.date=2025-01-02
setup.buy.shares.units=280000000
setup.buy.price.cents=100
setup.buy.commission.cents=0
setup.roc.date=2025-01-03
setup.roc.amount.cents=28000

t1.type=BUY
t1.date=2025-01-10
t1.shares.units=90000000
t1.price.cents=5561
t1.commission.cents=4300
t1.expected.shares.units=370000000
t1.expected.acb.cents=504790
t1.expected.acbPerShare.cents=1364
