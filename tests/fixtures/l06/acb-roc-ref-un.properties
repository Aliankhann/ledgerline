# L-06 AC1b and AC4. Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md).
# Source: adjustedcostbase.ca, "Return of Capital and How it Affects Adjusted Cost Base" (ACB-ROC).
# Heading: the section starting "As an example, let's assume you purchase 1,000 units of REF-UN.TO".
# Restated in the story's units (cents; 10^-6 share). The source gives no dates; t1.date and t2.date are QE-chosen
# (non-tax; any order-preserving pair gives the same values). Only the ROC portion (40%) is posted (story AC4).
source.id=ACB-ROC
source.url=https://www.adjustedcostbase.ca/blog/?p=258
source.heading=As an example, let's assume you purchase 1,000 units of REF-UN.TO
security=SYN-B

# AC1b. Quote: "1,000 units of REF-UN.TO at a price of $45.00 per unit with a commission of $10.00. The initial ACB
# becomes: (1,000 units x $45.00/unit) + $10.00 = $45,010.00".
t1.type=BUY
t1.date=2025-01-15
t1.shares.units=1000000000
t1.price.cents=4500
t1.commission.cents=1000
t1.expected.shares.units=1000000000
t1.expected.acb.cents=4501000

# AC4. Quote: "Then assume you receive a $1.00 per unit distribution that's composed of 60% income ($0.60 per unit) and
# 40% return of capital ($0.40 per unit). The ACB must be reduced to the following: $45,010.00 — (1,000 x $0.40/unit) =
# $45,010.00 — $400.00 = $44,610.00". Also: "ROC involves a cash distribution only and the number of units you own does
# not change" (site author reply, 2015-04-14), and "The return of capital portion of a distribution is not considered
# taxable income for the current tax year."
t2.type=RETURN_OF_CAPITAL
t2.date=2025-02-15
t2.amount.cents=40000
t2.expected.shares.units=1000000000
t2.expected.acb.cents=4461000
t2.expected.gain.cents=0
