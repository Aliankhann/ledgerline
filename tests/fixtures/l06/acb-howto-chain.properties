# L-06 AC1, AC2, AC3 and AC7 (AC8 run 1 reuses t1). Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md).
# Source: adjustedcostbase.ca, "How to Calculate Adjusted Cost Base (ACB) and Capital Gains" (ACB-HOWTO).
# Heading: the section starting "As a more complex example, let's assume the following transactions occur:".
# Values are restated as in docs/stories/L-06-pooled-acb.md: cash in integer cents (CAD), shares in units of
# 10^-6 share. The source gives month and day only; the story restates them in 2025 (the year changes no value).
# The source says its dates are settlement dates. Expected values are the source's own arithmetic, never QE's.
source.id=ACB-HOWTO
source.url=https://www.adjustedcostbase.ca/blog/how-to-calculate-adjusted-cost-base-acb-and-capital-gains/
source.heading=As a more complex example, let's assume the following transactions occur:
security=SYN-A

# Transaction 1, table row "1. Mar 3 Buy 100 $50 $10 100".
# Quote: "New Total ACB = [Previous Total ACB] + ([Share Price] x [Number of Shares Purchased]) + [Transaction Costs]
# = $0 + ($50/share x 100 shares) + $10 = $5,000 + $10 = $5,010". Summary row 1: "ACB $5,010 · ACB per Share $50.10".
t1.type=BUY
t1.date=2025-03-03
t1.shares.units=100000000
t1.price.cents=5000
t1.commission.cents=1000
t1.expected.shares.units=100000000
t1.expected.acb.cents=501000
t1.expected.acbPerShare.cents=5010

# Transaction 2. Quotes: "New Total ACB = $5,010 x ((100 shares – 50 shares) / 100 shares) = $2,505";
# "Capital Gain (or Loss) = (($120/share x 50 shares) – $10) – (($5,010 / 100 shares) x 50 shares) = $3,485".
# Summary row 2: "ACB $2,505 · $50.10 · $3,485".
t2.type=SELL
t2.date=2025-05-01
t2.shares.units=50000000
t2.price.cents=12000
t2.commission.cents=1000
t2.expected.gain.cents=348500
t2.expected.shares.units=50000000
t2.expected.acb.cents=250500
t2.expected.acbPerShare.cents=5010

# Transaction 3, table row "Jul 18 Buy 50 $130 $10 100 · $9,015 · $90.15".
# Quote: "New Total ACB = [Previous Total ACB] + ([Share Price] x [Number of Shares Purchased]) + [Transaction Costs]
# = $2,505 + ($130/share x 50 shares) + $10 = $9,015".
t3.type=BUY
t3.date=2025-07-18
t3.shares.units=50000000
t3.price.cents=13000
t3.commission.cents=1000
t3.expected.shares.units=100000000
t3.expected.acb.cents=901500
t3.expected.acbPerShare.cents=9015

# Transaction 4. Quotes: "New Total ACB = $9,015 x ((100 shares – 40 shares) / 100 shares) = $5,409";
# "(($90/share x 40 shares) – $10) – (($9,015 / 100 shares) x 40 shares) = –$16". Summary row 4: "$5,409 · $90.15 · ($16)".
t4.type=SELL
t4.date=2025-09-25
t4.shares.units=40000000
t4.price.cents=9000
t4.commission.cents=1000
t4.expected.gain.cents=-1600
t4.expected.shares.units=60000000
t4.expected.acb.cents=540900
t4.expected.acbPerShare.cents=9015
