# CRA fixture 5: partial superficial loss. Rule set assumed: CA-ITA-2026.1 (SL-PARTIAL).
# Source: CRA technical interpretation 2004-0073011E5, 2004-09-22 (read by the owner's research on a third-party host,
# taxinterpretations.com, not canada.ca; not re-fetched: docs/problem/sources-2026-11-22.md, 2026-11-22). The TI says
# the CRA "administratively accepts" SL = (least of S, P, B) / S x L, with S = shares sold, P = shares acquired in the
# 61-day period (30 days before the sale to 30 days after), B = shares held at the end of that period, L = the loss.
# Caveat in the TI: it may not reflect the CRA's current position.
# Facts (shares only): held 50; bought 10 in June 2003 (60 held); sold 50 on 2003-07-01 at a loss; bought 10 within 30
# days after; 20 held at the end. So S = 50, P = 20, B = 20 and the loss on 20/50 is denied and added to the ACB of
# the 20 shares under ITA 53(1)(f).
# THE TI GIVES NO PRICES AND NO OTHER DATES. TEST ASSUMPTIONS (not source): the 50 shares cost $100.00 each on
# 2003-01-15; the June purchase is 10 at $100.00 on 2003-06-10; the sale is at $80.00; the later purchase is 10 at
# $80.00 on 2003-07-15. Then L = 50 x (80 - 100) = $1,000 and the pool ACB before any add-back is
# $1,000 (10 shares kept) + $800 (10 shares bought) = $1,800. The spec asserts only the ratio
# denied x S = L x (least of S, P, B) and the add-back target, never a dollar amount that exists only by assumption.
# URL from the owner's 2026-11-22 research (third-party host of the CRA severed letter; not re-fetched here).
