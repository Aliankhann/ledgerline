# CRA fixture 2: capital gain with a selling commission. Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md).
# Source: Canada Revenue Agency, "Calculating and reporting your capital gains and losses", worked example with XYZ shares.
# Reported via the owner's research, not re-fetched: docs/problem/sources-2026-11-22.md, 2026-11-22.
# Quoted values (CAD): sold 400 XYZ on 2025-03-13 for $6,500, commission $60, ACB $4,000 -> gain $2,440
# (6,500 - 60 - 4,000); taxable portion $1,220 (not tested: the inclusion rate is outside the engine).
# The source gives the ACB only as a total. Test construction: ONE buy of 400 shares at $10.00 = $4,000.00 with NO
# commission, so the pool ACB is exactly the quoted $4,000. The buy date (2024-01-15) is a test assumption.
# URL NOTE: docs/problem/sources-2026-11-22.md reports this page only as "...line-12700-capital-gains/calculating-reporting-your-capital-gains-losses.html" (leading path elided) and the
# source.url is the full URL given in the owner's 2026-11-22 research (canada.ca was unreachable from the sandbox, so not re-fetched).
source.id=CRA-XYZ
source.url=https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/line-12700-capital-gains/calculating-reporting-your-capital-gains-losses.html
source.section=Worked example: 400 shares of XYZ sold 2025-03-13
source.heading=Calculating and reporting your capital gains and losses
security=SYN-CRA-XYZ

t1.type=BUY
t1.date=2024-01-15
t1.shares.units=400000000
t1.gross.cents=400000
t1.commission.cents=0
t1.expected.shares.units=400000000
t1.expected.acb.cents=400000

t2.type=SELL
t2.date=2025-03-13
t2.shares.units=400000000
t2.gross.cents=650000
t2.commission.cents=6000
t2.expected.gain.cents=244000
t2.expected.shares.units=0
t2.expected.acb.cents=0
