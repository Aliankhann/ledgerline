# CRA fixture 4: return of capital below zero. Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md: ROC-*).
# Source: Canada Revenue Agency, "Tax treatment of mutual funds" (Schedule 3 guide), return of capital example.
# Reported via the owner's research, not re-fetched: docs/problem/sources-2026-11-22.md, 2026-11-22.
# Quoted values (CAD): units bought for $1,000 in 2013; $200 return of capital each year 2016 to 2020 reduces the ACB
# to $0; a further $100 return of capital "this year" is a capital gain of $100 (line 13200) and the ACB stays $0.
# The source gives no quantity: 100 units at $10.00 = $1,000.00 with no commission is a test assumption and changes no
# value. Month and day are test assumptions; "this year" is placed in 2021 after the last $200 distribution.
# URL NOTE: docs/problem/sources-2026-11-22.md reports this page only as "...completing-schedule-3/tax-treatment-mutual-funds.html" (leading path elided) and the
# source.url is the full URL given in the owner's 2026-11-22 research (canada.ca was unreachable from the sandbox, so not re-fetched).
source.id=CRA-ROC
