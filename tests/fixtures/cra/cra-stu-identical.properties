# CRA fixture 1: identical properties, STU Ltd. Rule set assumed: CA-ITA-2026.1 (docs/tax-model.md).
# Source: Canada Revenue Agency, "Special rules for other transactions" (identical properties), example "STU Ltd.".
# Section: "Identical properties" (same text in guide T4037, chapter 3). Reported via the owner's research, not re-fetched:
# docs/problem/sources-2026-11-22.md, 2026-11-22. Source rule: "Dispositions of identical properties do not affect the ACB."
# Quoted values (CAD): 2001 buy 100 for $1,500 (ACB per share 15.00); 2006 buy 150 for $3,000 ($4,500 / 250 = 18.00);
# 2008 sell 200 for $3,600 (ACB per share stays 18.00, remaining ACB $900); 2025 buy 350 for $7,350
# ($900 + $7,350) / 400 = $8,250 / 400 = 20.63 (the CRA rounds to the cent; 8,250 / 400 is exactly 20.625).
# Not in the source: commissions (none are used here), month and day of each trade (test assumptions: the 15th of
# January; only the year is published), and the gain on the 2008 sale (not asserted).
# Restated in the story's units: cents, shares in units of 10^-6 share. Gross = quoted total price, in cents.
# URL NOTE: docs/problem/sources-2026-11-22.md reports this page only as "...line-12700-capital-gains/special-rules-other-transactions.html" (leading path elided) and the
# source.url is the full URL given in the owner's 2026-11-22 research (canada.ca was unreachable from the sandbox, so not re-fetched).
source.id=CRA-STU
source.url=https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/line-12700-capital-gains/special-rules-other-transactions.html
source.section=Identical properties, example STU Ltd.
