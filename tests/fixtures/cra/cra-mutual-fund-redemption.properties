# CRA fixture 3: mutual fund redemption with reinvested distributions. Rule set assumed: CA-ITA-2026.1.
# Source: Canada Revenue Agency, "Tax treatment of mutual funds" (Schedule 3 guide), chart of purchases, reinvested
# distributions and a redemption. Reported via the owner's research, not re-fetched: docs/problem/sources-2026-11-22.md.
# Chart rows (CAD, units to 4 decimals; a share unit here is 10^-6, so 4-decimal units are exact):
#   purchase 20,000.00 for 1,355.9322 units; reinvested distribution 1,427.82 for 87.0622 units;
#   purchase 5,000.00 for 289.1845 units; reinvested distribution 962.11 for 69.8700 units;
#   redemption of 200 units at $17.42 = $3,484.00, fee $70.00.
# Published result: ACB of the redeemed units 200 x $15.20 = $3,040.00; gain 3,484 - 70 - 3,040 = $374.00.
# KNOWN DIFFERENCE, not hidden: the CRA multiplies by an ACB per unit ROUNDED to the cent ($15.20). Exact pooled ACB
# is 27,389.93 over 1,802.0489 units: the unrounded per-unit ACB is 15.1993..., so 200 units carry about 3,039.87,
# not 3,040.00, and the gain is about 374.13, not 374.00 (the spec computes the exact figures). The cra.* keys are the published values; the spec asserts them
# only where our unrounded pooling agrees (the per-unit ACB shown to the cent) and asserts our own exact value for
# the redemption, computed in the test from this fixture's cost and units by integer arithmetic.
# Dates are test assumptions (the chart gives none); they are in canonical order.
# URL NOTE: docs/problem/sources-2026-11-22.md reports this page only as "...completing-schedule-3/tax-treatment-mutual-funds.html" (leading path elided) and the
# source.url is the full URL given in the owner's 2026-11-22 research (canada.ca was unreachable from the sandbox, so not re-fetched).
