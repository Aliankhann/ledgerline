name: CI

on:
  push:
    branches: [main, "l-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roles:
    name: Role check (test ownership)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits in this PR
        if: github.event_name == 'pull_request'
        run: scripts/check-test-ownership.sh "origin/${{ github.base_ref }}" HEAD
      # Work is pushed straight to main (owner rule), so also check every commit in each push.
      - name: Check commits in this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: scripts/check-test-ownership.sh "${{ github.event.before }}" "${{ github.sha }}"

  build:
    name: Build, lint, unit/spec/property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # build = compile (warnings are errors) + ktlintCheck + test (Integration-tagged tests excluded)
      - run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  integration:
    name: Integration and chaos tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Oracle for L-15 (differential ACB check), pinned to an exact commit.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-acb-ee4afc7c68747a3027ade65599ad9d5836c70807
      - name: Install acb (pinned)
        run: |
          if ! command -v acb >/dev/null 2>&1; then
            cargo install --git https://github.com/tsiemens/acb.git --rev ee4afc7c68747a3027ade65599ad9d5836c70807 --locked acb
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: ./gradlew :tests:test -PincludeIntegration --no-daemon
        env:
          ACB_REQUIRED: "1"

  ui:
    name: UI typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8080/health
      # End-to-end: POST activities -> ledger -> outbox -> Redpanda -> PoolConsumer -> holdings route.
      - name: End-to-end demo pipeline
        run: |
          bash scripts/demo.sh | tee demo-out.txt
          grep -q 'SYN-AAA' demo-out.txt || { echo "::error::no holding reached the pools"; exit 1; }
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
