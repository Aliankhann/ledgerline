name: Bench

on:
  workflow_dispatch:
  push:
    branches: ["l-bench*"]

jobs:
  bench:
    name: Benchmark (ingest, burst, import, replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Hardware
        run: |
          lscpu
          nproc
          free -h
      # The app container runs the Flyway migrations and enables the ledgerline_app login; the bench uses AppConfig's
      # defaults (localhost:5432, ledgerline_app) and writes straight into the same Postgres. Seeded data uses year 2025,
      # the bench uses 2022-2024, so idempotency keys never collide.
      - run: docker compose up -d --build --wait postgres redpanda redpanda-init app
      - run: ./gradlew :bench:run --no-daemon --args="--seed 42 --activities 20000"
      - name: Report
        run: cat bench/out/report.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench/out/report.md
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
